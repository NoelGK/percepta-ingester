[tool.poetry]
name = "percepta"
version = "0.0.1"
description = ""
authors = ["Noel Gomariz"]
readme = "README.md"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "~2.11.1"
