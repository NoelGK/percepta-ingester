python-dotenv = "1.1.0"
requests = "2.32.3"
fastapi = "^0"
uvicorn = "0.34.0"
gunicorn = "23.0.0"
pika = "1.3.2"
numpy = "^2.2.4"
celery = "5.4.0"
toml = "^0.10.2"
opencv-python = "^4.11.0.86"
pillow = "11.1.0"
redis = "5.2.1"
hiredis = "3.1.0"
